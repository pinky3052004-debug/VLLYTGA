name: Smooth Live Stream

on:
  workflow_dispatch:
  repository_dispatch:
    types: [continue-live]

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq

      - name: Run Streaming Script
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Google Drive ဖိုင်၏ ID ကို ဤနေရာတွင် ထည့်ပါ
          GDRIVE_FILE_ID: "1OsgPXRcVIVG5rI22FQKYjBkoEV4Y9jT1"
        run: |
          python3 -u << 'EOF'
          import os
          import time
          import subprocess
          import json
          import urllib.request

          stream_key = os.environ["YOUTUBE_STREAM_KEY"]
          file_id = os.environ["GDRIVE_FILE_ID"]
          direct_url = f"https://drive.google.com/uc?export=download&id={file_id}"
          
          repo = os.environ["GITHUB_REPOSITORY"]
          gh_token = os.environ["GH_PAT"]

          status_file = "stream_status.json"

          def read_status():
              if os.path.exists(status_file):
                  with open(status_file, "r") as f:
                      return json.load(f)
              return {"status": "idle", "current_position": 0, "vm2_ready": False}

          def write_status(data):
              with open(status_file, "w") as f:
                  json.dump(data, f, indent=2)
              # GitHub သို့ ချက်ချင်း commit/push လုပ်ရန်
              os.system("git config user.name 'Stream Bot'")
              os.system("git config user.email 'bot@users.noreply.github.com'")
              os.system(f"git add {status_file}")
              os.system("git commit -m 'Update stream status [skip ci]' || true")
              os.system("git push || true")

          # -------------------------------------------------------------
          # Determine if this is VM 1 or VM 2
          # -------------------------------------------------------------
          current_state = read_status()
          start_pos = current_state.get("current_position", 0)

          # အကယ်၍ start_pos က 0 ထက်ကြီးနေလျှင် ဒါသည် VM 2 ဖြစ်သည်
          is_vm2 = start_pos > 0

          if is_vm2:
              print(f"[*] I am VM 2. Resuming from position: {start_pos} seconds")
              # VM 2 အသင့်ဖြစ်ကြောင်း ချက်ချင်း အချက်ပြမည်
              current_state["vm2_ready"] = True
              current_state["status"] = "vm2_active"
              write_status(current_state)
          else:
              print("[*] I am VM 1. Starting from the beginning (0).")
              current_state["status"] = "vm1_active"
              current_state["current_position"] = 0
              current_state["vm2_ready"] = False
              write_status(current_state)

          # -------------------------------------------------------------
          # FFmpeg Command Setup (Direct GDrive URL, No local download!)
          # -------------------------------------------------------------
          cmd = [
              "ffmpeg",
              "-hide_banner",
              "-loglevel", "info",
              "-ss", str(start_pos),
              "-i", direct_url,
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-tune", "zerolatency",
              "-pix_fmt", "yuv420p",
              "-r", "30",
              "-g", "60",
              "-keyint_min", "60",
              "-b:v", "4500k",
              "-maxrate", "4500k",
              "-bufsize", "9000k",
              "-c:a", "aac",
              "-b:a", "128k",
              "-ar", "44100",
              "-f", "flv",
              f"rtmps://a.rtmps.youtube.com/live2/{stream_key}"
          ]

          print(f"[*] Starting FFmpeg stream...")
          process = subprocess.Popen(cmd)

          # -------------------------------------------------------------
          # Monitoring Loop (Handling the Handover logic)
          # -------------------------------------------------------------
          # VM 1 အတွက်: ဥပမာ - မိနစ် ၄၀ (စက္ကန့် ၂၄၀၀) ရောက်လျှင် VM 2 ကို ကြိုခေါ်မည်
          triggered_vm2 = False
          start_time = time.time()

          try:
              while process.poll() is None:
                  time.sleep(10)
                  elapsed_live_time = int(time.time() - start_time)
                  current_video_pos = start_pos + elapsed_live_time

                  # အကယ်၍ ကျွန်ုပ်တို့သည် VM 1 ဖြစ်ပြီး အချိန်က မိနစ် ၄၀ (၂၄၀၀ စက္ကန့်) ရောက်လာလျှင်
                  if not is_vm2 and elapsed_live_time >= 2400 and not triggered_vm2:
                      print("[*] VM 1: Reached 40 minutes. Triggering VM 2 early for download/prep...")
                      
                      # GitHub API သို့ repository_dispatch လှမ်းပို့၍ VM 2 ကို နှိုးမည်
                      req_data = json.dumps({"event_type": "continue-live"}).encode("utf-8")
                      req = urllib.request.Request(
                          f"https://api.github.com/repos/{repo}/dispatches",
                          data=req_data,
                          headers={
                              "Authorization": f"Bearer {gh_token}",
                              "Accept": "application/vnd.github+json",
                              "Content-Type": "application/json"
                          }
                      )
                      try:
                          urllib.request.urlopen(req)
                          print("[*] VM 2 successfully triggered!")
                      except Exception as e:
                          print(f"[!] Failed to trigger VM 2: {e}")
                      
                      triggered_vm2 = True

                  # အကယ်၍ ကျွန်ုပ်တို့သည် VM 1 ဖြစ်ပြီး, မိနစ် ၅၅ (၃၃၀၀ စက္ကန့်) ရောက်လာလျှင် VM 2 အသင့်ဖြစ်မဖြစ် စစ်ဆေးမည်
                  if not is_vm2 and elapsed_live_time >= 3300:
                      print("[*] VM 1: Checking if VM 2 is ready...")
                      # Git pull လုပ်၍ status အသစ်ကို ယူမည်
                      os.system("git pull --rebase || true")
                      st = read_status()
                      
                      if st.get("vm2_ready", False):
                          print("[*] VM 1: VM 2 is ready! Handing over the current spot...")
                          st["current_position"] = current_video_pos
                          st["status"] = "handover_complete"
                          write_status(st)
                          print("[*] VM 1: Spot handed over. Stopping VM 1 stream gracefully.")
                          break

                  # အကယ်၍ ကျွန်ုပ်တို့သည် VM 2 ဖြစ်နေပြီး, အခြား VM အသစ်တစ်ခုက ထပ်တက်လာခဲ့လျှင် (လိုအပ်ပါက ဤနေရာတွင် ဆက်လက်ထိန်းချုပ်နိုင်သည်)
          
          except KeyboardInterrupt:
              pass
          finally:
              if process.poll() is None:
                  process.terminate()
                  process.wait()
          
          print("[*] Streaming session for this VM ended cleanly.")
          EOF
